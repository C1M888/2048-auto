<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f3eb"><title>2048 Auto · 自动合成</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#273c35;background:#f6f3eb}*{box-sizing:border-box}body{margin:0;padding:36px 18px}main{max-width:490px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:11px;letter-spacing:3px;color:#63796c;font-weight:700}h1{font-size:64px;line-height:1;margin:12px 0 8px;letter-spacing:-4px}h1 span{font-size:19px;letter-spacing:0;color:#64816d}.scores{display:flex;gap:8px}.score{background:#e7e9df;padding:12px;border-radius:12px;text-align:center;min-width:72px;font-size:11px;color:#637267}.score strong{display:block;font-size:22px;color:#273c35}p{font-size:14px;line-height:1.8;color:#6b786e}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:22px 0 15px;gap:10px}button{font:inherit;cursor:pointer;border:0;border-radius:10px;background:#e4e7dd;color:#334c3e;padding:12px 16px;font-weight:650}button:focus-visible,input:focus-visible{outline:3px solid #d68942;outline-offset:3px}#auto{background:#2e5947;color:white;min-width:155px}#auto[aria-pressed=true]{background:#b15f3c}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px;background:#b6bfb0;border-radius:18px;touch-action:none;outline:none}.tile{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:clamp(23px,7vw,38px);font-weight:750;background:#cbd2c5;color:#334c3e}.tile[data-v="2"]{background:#edf0df}.tile[data-v="4"]{background:#e2e7c0}.tile[data-v="8"]{background:#bed49d}.tile[data-v="16"]{background:#8fb98a}.tile[data-v="32"]{background:#639c78;color:white}.tile[data-v="64"]{background:#3d7b64;color:white}.tile[data-v="128"]{background:#efca83}.tile[data-v="256"]{background:#e7b56b}.tile[data-v="512"]{background:#da9352;color:white}.tile[data-v="1024"]{background:#bd713e;color:white;font-size:29px}.tile[data-v="2048"]{background:#e4b23d;color:white;font-size:29px}.tile.large{background:#284c3f;color:#fff;font-size:25px}.settings{margin-top:18px;padding:18px;background:#fff9;border:1px solid #e2e5da;border-radius:14px}.speed{display:flex;justify-content:space-between;font-size:13px;font-weight:650}input{width:100%;margin:16px 0 4px;accent-color:#3d7156}#status{min-height:25px;font-size:13px;color:#47634f;margin:14px 2px}.arrows{display:flex;justify-content:center;gap:9px;margin:15px 0}.arrows button{width:58px;font-size:20px}footer{text-align:center;font-size:12px;line-height:1.9;color:#839083;margin-top:22px}@media(max-width:380px){body{padding:20px 12px}.score{min-width:62px;padding:9px}h1{font-size:53px}#board{gap:8px;padding:10px}}

#board{position:relative;isolation:isolate;box-shadow:0 12px 30px #304b3b12;--slide:170ms}.slot{aspect-ratio:1;background:#cbd2c5;border-radius:10px}.tile{position:absolute;z-index:1;box-shadow:0 3px 0 #203b3014;will-change:transform;user-select:none}.tile.spawn{animation:appear 240ms cubic-bezier(.16,1,.3,1)}.tile.merge{z-index:3;animation:merge 290ms cubic-bezier(.2,.8,.3,1)}.tile.merge:after{content:"";position:absolute;inset:-3px;border:3px solid #f4d778;border-radius:13px;pointer-events:none;animation:ripple 350ms ease-out forwards}.score{position:relative}.score-burst{position:absolute;left:0;right:0;top:5px;color:#c27932;font-size:24px;font-weight:800;pointer-events:none;animation:points 700ms ease-out forwards}.tile[data-v="2048"]{box-shadow:0 0 22px #e4b23d66}button{transition:transform 100ms,background 160ms}button:active{transform:scale(.95)}
@keyframes appear{from{transform:scale(.2);opacity:0}70%{transform:scale(1.08);opacity:1}to{transform:scale(1);opacity:1}}
@keyframes merge{0%{transform:scale(.88)}45%{transform:scale(1.19)}75%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes ripple{from{transform:scale(.9);opacity:.9}to{transform:scale(1.3);opacity:0}}
@keyframes points{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-44px);opacity:0}}
.motion-off .tile.spawn,.motion-off .tile.merge,.motion-off .tile.merge:after,.motion-off .score-burst{animation:none}.motion-off .score-burst{display:none}.motion-setting{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;font-size:13px;font-weight:650}select{font:inherit;padding:8px;border-radius:8px;border:1px solid #b6bfb0;color:#334c3e;background:#f6f3eb}.version{font-size:10px;opacity:.8}
</style></head><body><main><header><div><div class="eyebrow">A LITTLE SPACE TO PLAY</div><h1>2048 <span>AUTO</span></h1></div><div class="scores"><div class="score">得分<strong id="score">0</strong></div><div class="score">本机最高<strong id="best">0</strong></div></div></header><p>合并相同数字，慢慢抵达 2048。<br>自己玩，或让 AI 接着走。</p><div class="toolbar"><button id="auto" aria-pressed="false">▶ 开启自动合成</button><button id="reset">重新开始</button></div><div id="board" tabindex="0" role="group" aria-label="2048 棋盘，使用方向键移动"></div><div id="status" role="status" aria-live="polite"></div><div class="settings"><div class="motion-setting"><label for="motion">移动动画</label><select id="motion"><option value="smooth">流畅滑动</option><option value="slow">慢动作</option><option value="none">关闭动画</option></select></div><label class="speed" for="speed"><span>自动合成速度</span><span><output id="speedValue">5</output> / 10</span></label><input id="speed" type="range" min="1" max="10" value="5"><div class="speed"><span>慢慢思考</span><span>快速合成</span></div></div><nav class="arrows" aria-label="方向控制"><button data-dir="left" aria-label="向左">←</button><button data-dir="up" aria-label="向上">↑</button><button data-dir="down" aria-label="向下">↓</button><button data-dir="right" aria-label="向右">→</button></nav><footer>方向键 / WASD · 手机上滑动棋盘<br>单机独立棋局 · 进度仅保存在你的浏览器<br>其他玩家不会影响你的棋盘 · AI 不保证每局获胜<br><span class="version">滑动动画版 3</span></footer></main>
<script src="ai.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),dirs=['left','up','right','down'];
let board=Array(16).fill(0),score=0,best=0,running=false,timer=null,won=false,busy=false,queued=null,generation=0,autoEpoch=0;
function slide(b,dir){const out=b.slice();let gain=0;for(let r=0;r<4;r++){const ids=Array.from({length:4},(_,c)=>dir==='left'?r*4+c:dir==='right'?r*4+3-c:dir==='up'?c*4+r:(3-c)*4+r);const line=ids.map(i=>b[i]).filter(Boolean),merged=[];for(let j=0;j<line.length;j++){if(line[j]===line[j+1]){const n=line[j]*2;merged.push(n);gain+=n;j++;}else merged.push(line[j]);}ids.forEach((id,i)=>out[id]=merged[i]||0);}return {board:out,gain,changed:out.some((v,i)=>v!==b[i])};}
function spawn(){const empty=board.map((v,i)=>v?-1:i).filter(i=>i>=0);if(!empty.length)return -1;const i=empty[Math.floor(Math.random()*empty.length)];board[i]=Math.random()<.9?2:4;return i;}
function over(b){return dirs.every(d=>!slide(b,d).changed);}
function save(){try{localStorage.setItem('2048-auto-v1',JSON.stringify({board,score,best,won,speed:+$('speed').value,motion:$('motion').value}));}catch{}}
function updateStatus(){const dead=over(board);if(dead)stop();$('status').textContent=dead?'本局结束。点击「重新开始」再来一局。':won?'已合成 2048！可以继续挑战更大的数字。':running?'AI 正在预判下一步…':'手动模式 · 合并数字，保留空位';}
function positionTile(el,i){const slot=$('board').children[i];el.style.left=slot.offsetLeft+'px';el.style.top=slot.offsetTop+'px';el.style.width=slot.offsetWidth+'px';el.style.height=slot.offsetHeight+'px';}
function render(merged=[],fresh=[]){const grid=$('board');grid.replaceChildren(...Array.from({length:16},()=>{const e=document.createElement('div');e.className='slot';e.setAttribute('aria-hidden','true');return e;}));board.forEach((v,i)=>{if(!v)return;const el=document.createElement('div');el.className='tile'+(v>2048?' large':'')+(merged.includes(i)?' merge':fresh.includes(i)?' spawn':'');el.dataset.v=v;el.dataset.index=i;el.textContent=v;el.setAttribute('aria-label',String(v));positionTile(el,i);grid.append(el);});$('score').textContent=score;$('best').textContent=best;updateStatus();save();}
// Keep both source tiles until they reach the shared destination.
function motionPlan(b,dir){const moves=[],merged=[];for(let r=0;r<4;r++){const ids=Array.from({length:4},(_,c)=>dir==='left'?r*4+c:dir==='right'?r*4+3-c:dir==='up'?c*4+r:(3-c)*4+r);const occupied=ids.filter(i=>b[i]);let target=0;for(let j=0;j<occupied.length;j++){const to=ids[target++];moves.push({from:occupied[j],to});if(j+1<occupied.length&&b[occupied[j]]===b[occupied[j+1]]){moves.push({from:occupied[++j],to});merged.push(to);}}}return {moves,merged};}
// Speed 5 matches the former speed 10; higher settings shorten motion and pauses together.
function autoTiming(speed){return {scale:Math.min(1,5/speed),delay:speed<=5?900-170*speed:250/speed};}
async function move(dir){if(busy){queued=dir;return false;}const next=slide(board,dir);if(!next.changed)return false;busy=true;const version=generation;const plan=motionPlan(board,dir),grid=$('board');const reduced=$('motion').value==='none';const pace=running?autoTiming(Number($('speed').value)).scale:1;const duration=reduced?0:($('motion').value==='slow'?520:320)*pace;const animations=[];
for(const {from,to} of plan.moves){const el=grid.querySelector('[data-index="'+from+'"]');el.classList.remove('spawn','merge');if(from===to)continue;const a=grid.children[from],b=grid.children[to];const animation=el.animate([{transform:'translate(0,0)'},{transform:'translate('+(b.offsetLeft-a.offsetLeft)+'px,'+(b.offsetTop-a.offsetTop)+'px)'}],{duration,easing:'cubic-bezier(.35,0,.25,1)',fill:'forwards'});animations.push(animation.finished.catch(()=>{}));}
// Commit immediately so refreshing during an animation never loses a move.
board=next.board;score+=next.gain;best=Math.max(best,score);won=won||board.some(v=>v>=2048);const fresh=spawn();save();await Promise.all(animations);if(version!==generation)return false;render(plan.merged,[fresh]);
if(next.gain){const burst=document.createElement('span');burst.className='score-burst';burst.textContent='+'+next.gain;$('score').parentElement.append(burst);setTimeout(()=>burst.remove(),750);}
await new Promise(resolve=>setTimeout(resolve,reduced?0:300*pace));if(version!==generation)return false;busy=false;if(queued){const d=queued;queued=null;void move(d);}return true;}
new ResizeObserver(()=>{if(!busy)document.querySelectorAll('.tile').forEach(el=>positionTile(el,+el.dataset.index));}).observe($('board'));
// Search off the UI thread; a short fallback also supports file:// and blocked workers.
const fallbackAI=createAI();
let aiWorker=null,pendingAI=null,requestId=0;
function cancelAI(){
  if(pendingAI){clearTimeout(pendingAI.watchdog);pendingAI.resolve(null);pendingAI=null;
    if(aiWorker){aiWorker.terminate();aiWorker=null;}}
}
function choose(b){
  return new Promise(resolve=>{
    const id=++requestId;
    const fallback=()=>{if(!pendingAI||pendingAI.id!==id)return;
      if(aiWorker)aiWorker.terminate();aiWorker=null;
      clearTimeout(pendingAI.watchdog);pendingAI=null;resolve(fallbackAI.choose(b,8));};
    pendingAI={id,resolve,watchdog:setTimeout(fallback,1500)};
    try{
      if(!aiWorker){aiWorker=new Worker('ai.js');
        aiWorker.onmessage=({data})=>{if(!pendingAI||data.id!==pendingAI.id)return;
          const request=pendingAI;clearTimeout(request.watchdog);pendingAI=null;request.resolve(data.dir);};
      }
      aiWorker.onerror=event=>{event.preventDefault();fallback();};
      aiWorker.postMessage({id,board:b,budget:90});
    }catch{fallback();}
  });
}
function stop(){autoEpoch++;cancelAI();running=false;clearTimeout(timer);timer=null;$('auto').textContent='▶ 开启自动合成';$('auto').setAttribute('aria-pressed','false');}
async function tick(epoch){if(!running||epoch!==autoEpoch)return;if(busy){timer=setTimeout(()=>tick(epoch),40);return;}const dir=await choose(board.slice());if(!running||epoch!==autoEpoch)return;if(dir===null){stop();updateStatus();return;}await move(dir);if(running&&epoch===autoEpoch)timer=setTimeout(()=>tick(epoch),autoTiming(Number($('speed').value)).delay);}
$('auto').onclick=()=>{if(running)stop();else if(!over(board)){queued=null;running=true;const epoch=++autoEpoch;$('auto').textContent='Ⅱ 暂停自动合成';$('auto').setAttribute('aria-pressed','true');timer=setTimeout(()=>tick(epoch),0);}updateStatus();};
function reset(){stop();generation++;queued=null;busy=false;board=Array(16).fill(0);score=0;won=false;const a=spawn(),b=spawn();render([],[a,b]);}
$('reset').onclick=()=>{if(score>0&&!confirm('要重新开始吗？当前这局的进度将被替换。'))return;reset();};
$('motion').onchange=()=>{document.body.classList.toggle('motion-off',$('motion').value==='none');save();};
$('speed').oninput=()=>{$('speedValue').textContent=$('speed').value;save();};
function manual(d){stop();void move(d);updateStatus();}
document.querySelectorAll('[data-dir]').forEach(el=>el.onclick=()=>manual(el.dataset.dir));
document.addEventListener('keydown',e=>{if(['INPUT','BUTTON'].includes(e.target.tagName))return;const map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'};const d=map[e.key]||map[e.key.toLowerCase()];if(d){e.preventDefault();manual(d);}});
let start=null;$('board').addEventListener('pointerdown',e=>{start=[e.clientX,e.clientY];$('board').setPointerCapture(e.pointerId);});$('board').addEventListener('pointerup',e=>{if(!start)return;const x=e.clientX-start[0],y=e.clientY-start[1];start=null;if(Math.max(Math.abs(x),Math.abs(y))<20)return;manual(Math.abs(x)>Math.abs(y)?x>0?'right':'left':y>0?'down':'up');});$('board').addEventListener('pointercancel',()=>start=null);
try{const s=JSON.parse(localStorage.getItem('2048-auto-v1'));if(s&&Array.isArray(s.board)&&s.board.length===16&&s.board.every(v=>Number.isSafeInteger(v)&&v>=0&&(v===0||v>=2&&Number.isInteger(Math.log2(v))))&&Number.isSafeInteger(s.score)&&s.score>=0){board=s.board;score=s.score;best=Math.max(score,Number.isSafeInteger(s.best)?s.best:0);won=board.some(v=>v>=2048);$('speed').value=Math.min(10,Math.max(1,s.speed||5));if(['smooth','slow','none'].includes(s.motion))$('motion').value=s.motion;}}catch{}
document.body.classList.toggle('motion-off',$('motion').value==='none');
$('speedValue').textContent=$('speed').value;if(board.every(v=>!v))reset();else render();
</script></body></html>
