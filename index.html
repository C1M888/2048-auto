<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f3eb"><title>2048 Auto · 自动合成</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#273c35;background:#f6f3eb}*{box-sizing:border-box}body{margin:0;padding:36px 18px}main{max-width:490px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:11px;letter-spacing:3px;color:#63796c;font-weight:700}h1{font-size:64px;line-height:1;margin:12px 0 8px;letter-spacing:-4px}h1 span{font-size:19px;letter-spacing:0;color:#64816d}.scores{display:flex;gap:8px}.score{background:#e7e9df;padding:12px;border-radius:12px;text-align:center;min-width:72px;font-size:11px;color:#637267}.score strong{display:block;font-size:22px;color:#273c35}p{font-size:14px;line-height:1.8;color:#6b786e}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:22px 0 15px;gap:10px}button{font:inherit;cursor:pointer;border:0;border-radius:10px;background:#e4e7dd;color:#334c3e;padding:12px 16px;font-weight:650}button:focus-visible,input:focus-visible{outline:3px solid #d68942;outline-offset:3px}#auto{background:#2e5947;color:white;min-width:155px}#auto[aria-pressed=true]{background:#b15f3c}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px;background:#b6bfb0;border-radius:18px;touch-action:none;outline:none}.tile{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:clamp(23px,7vw,38px);font-weight:750;background:#cbd2c5;color:#334c3e}.tile[data-v="2"]{background:#edf0df}.tile[data-v="4"]{background:#e2e7c0}.tile[data-v="8"]{background:#bed49d}.tile[data-v="16"]{background:#8fb98a}.tile[data-v="32"]{background:#639c78;color:white}.tile[data-v="64"]{background:#3d7b64;color:white}.tile[data-v="128"]{background:#efca83}.tile[data-v="256"]{background:#e7b56b}.tile[data-v="512"]{background:#da9352;color:white}.tile[data-v="1024"]{background:#bd713e;color:white;font-size:29px}.tile[data-v="2048"]{background:#e4b23d;color:white;font-size:29px}.tile.large{background:#284c3f;color:#fff;font-size:25px}.settings{margin-top:18px;padding:18px;background:#fff9;border:1px solid #e2e5da;border-radius:14px}.speed{display:flex;justify-content:space-between;font-size:13px;font-weight:650}input{width:100%;margin:16px 0 4px;accent-color:#3d7156}#status{min-height:25px;font-size:13px;color:#47634f;margin:14px 2px}.arrows{display:flex;justify-content:center;gap:9px;margin:15px 0}.arrows button{width:58px;font-size:20px}footer{text-align:center;font-size:12px;line-height:1.9;color:#839083;margin-top:22px}@media(max-width:380px){body{padding:20px 12px}.score{min-width:62px;padding:9px}h1{font-size:53px}#board{gap:8px;padding:10px}}
</style></head><body><main><header><div><div class="eyebrow">A LITTLE SPACE TO PLAY</div><h1>2048 <span>AUTO</span></h1></div><div class="scores"><div class="score">得分<strong id="score">0</strong></div><div class="score">最高分<strong id="best">0</strong></div></div></header><p>合并相同数字，慢慢抵达 2048。<br>自己玩，或让 AI 接着走。</p><div class="toolbar"><button id="auto" aria-pressed="false">▶ 开启自动合成</button><button id="reset">重新开始</button></div><div id="board" tabindex="0" role="group" aria-label="2048 棋盘，使用方向键移动"></div><div id="status" role="status" aria-live="polite"></div><div class="settings"><label class="speed" for="speed"><span>自动合成速度</span><span><output id="speedValue">5</output> / 10</span></label><input id="speed" type="range" min="1" max="10" value="5"><div class="speed"><span>慢慢思考</span><span>快速合成</span></div></div><nav class="arrows" aria-label="方向控制"><button data-dir="left" aria-label="向左">←</button><button data-dir="up" aria-label="向上">↑</button><button data-dir="down" aria-label="向下">↓</button><button data-dir="right" aria-label="向右">→</button></nav><footer>方向键 / WASD · 手机上滑动棋盘<br>进度自动保存在此浏览器 · AI 不保证每局获胜</footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id),dirs=['left','up','right','down'];
let board=Array(16).fill(0),score=0,best=0,running=false,timer=null,won=false;
function slide(b,dir){const out=b.slice();let gain=0;for(let r=0;r<4;r++){const ids=Array.from({length:4},(_,c)=>dir==='left'?r*4+c:dir==='right'?r*4+3-c:dir==='up'?c*4+r:(3-c)*4+r);const line=ids.map(i=>b[i]).filter(Boolean),merged=[];for(let j=0;j<line.length;j++){if(line[j]===line[j+1]){const n=line[j]*2;merged.push(n);gain+=n;j++;}else merged.push(line[j]);}ids.forEach((id,i)=>out[id]=merged[i]||0);}return {board:out,gain,changed:out.some((v,i)=>v!==b[i])};}
function spawn(){const empty=board.map((v,i)=>v? -1:i).filter(i=>i>=0);if(empty.length)board[empty[Math.floor(Math.random()*empty.length)]]=Math.random()<.9?2:4;}
function over(b){return dirs.every(d=>!slide(b,d).changed);}
function save(){try{localStorage.setItem('2048-auto-v1',JSON.stringify({board,score,best,won,speed:+$('speed').value}));}catch{}}
function render(){const grid=$('board');grid.replaceChildren(...board.map(v=>{const el=document.createElement('div');el.className='tile'+(v>2048?' large':'');el.dataset.v=v;el.textContent=v||'';el.setAttribute('aria-label',v?String(v):'空格');return el;}));$('score').textContent=score;$('best').textContent=best;const dead=over(board);if(dead)stop();$('status').textContent=dead?'本局结束。点击「重新开始」再来一局。':won?'已合成 2048！可以继续挑战更大的数字。':running?'AI 正在预判下一步…':'手动模式 · 合并数字，保留空位';save();}
function move(dir){const next=slide(board,dir);if(!next.changed)return false;board=next.board;score+=next.gain;best=Math.max(best,score);if(board.some(v=>v>=2048))won=true;spawn();render();return true;}
function quality(b){let empty=0,smooth=0,mono=0;const log=b.map(v=>v?Math.log2(v):0);for(let r=0;r<4;r++){let rowUp=0,rowDown=0,colUp=0,colDown=0;for(let c=0;c<4;c++){let i=r*4+c;if(!b[i])empty++;if(c<3){const a=log[i],z=log[i+1];rowUp+=Math.max(0,z-a);rowDown+=Math.max(0,a-z);if(a&&z)smooth-=Math.abs(a-z);const x=log[c*4+r],y=log[(c+1)*4+r];colUp+=Math.max(0,y-x);colDown+=Math.max(0,x-y);if(x&&y)smooth-=Math.abs(x-y);}}mono-=Math.min(rowUp,rowDown)+Math.min(colUp,colDown);}const max=Math.max(...log),corner=Math.max(log[0],log[3],log[12],log[15]);return empty*270+mono*35+smooth*8+max*25+(corner===max?150:0);}
function search(b,depth,chance){if(depth===0)return quality(b);if(chance){const empty=b.map((v,i)=>v?-1:i).filter(i=>i>=0);if(!empty.length)return search(b,depth-1,false);let sum=0;for(const i of empty){const next=b.slice();next[i]=2;sum+=.9*search(next,depth-1,false);next[i]=4;sum+=.1*search(next,depth-1,false);}return sum/empty.length;}let value=-1e8;for(const d of dirs){const n=slide(b,d);if(n.changed)value=Math.max(value,search(n.board,depth-1,true)+n.gain*.1);}return value;}
function choose(b){let answer=null,value=-Infinity;for(const d of dirs){const n=slide(b,d);if(n.changed){const v=search(n.board,3,true)+n.gain*.1;if(v>value){value=v;answer=d;}}}return answer;}
function stop(){running=false;clearTimeout(timer);timer=null;$('auto').textContent='▶ 开启自动合成';$('auto').setAttribute('aria-pressed','false');}
function tick(){if(!running)return;const dir=choose(board);if(dir===null){stop();render();return;}move(dir);if(running)timer=setTimeout(tick,1100-Number($('speed').value)*100);}
$('auto').onclick=()=>{if(running)stop();else if(!over(board)){running=true;$('auto').textContent='Ⅱ 暂停自动合成';$('auto').setAttribute('aria-pressed','true');timer=setTimeout(tick,0);}render();};
function reset(){stop();board=Array(16).fill(0);score=0;won=false;spawn();spawn();render();}
$('reset').onclick=()=>{if(score>0&&!confirm('要重新开始吗？当前这局的进度将被替换。'))return;reset();};
$('speed').oninput=()=>{$('speedValue').textContent=$('speed').value;save();};
function manual(d){stop();move(d);render();}
document.querySelectorAll('[data-dir]').forEach(el=>el.onclick=()=>manual(el.dataset.dir));
document.addEventListener('keydown',e=>{if(['INPUT','BUTTON'].includes(e.target.tagName))return;const map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'};const d=map[e.key]||map[e.key.toLowerCase()];if(d){e.preventDefault();manual(d);}});
let start=null;$('board').addEventListener('pointerdown',e=>{start=[e.clientX,e.clientY];$('board').setPointerCapture(e.pointerId);});$('board').addEventListener('pointerup',e=>{if(!start)return;const x=e.clientX-start[0],y=e.clientY-start[1];start=null;if(Math.max(Math.abs(x),Math.abs(y))<20)return;manual(Math.abs(x)>Math.abs(y)?x>0?'right':'left':y>0?'down':'up');});$('board').addEventListener('pointercancel',()=>start=null);
try{const s=JSON.parse(localStorage.getItem('2048-auto-v1'));if(s&&Array.isArray(s.board)&&s.board.length===16&&s.board.every(v=>Number.isSafeInteger(v)&&v>=0&&(v===0||v>=2&&Number.isInteger(Math.log2(v))))&&Number.isSafeInteger(s.score)&&s.score>=0){board=s.board;score=s.score;best=Math.max(score,Number.isSafeInteger(s.best)?s.best:0);won=board.some(v=>v>=2048);$('speed').value=Math.min(10,Math.max(1,s.speed||5));}}catch{}
$('speedValue').textContent=$('speed').value;if(board.every(v=>!v))reset();else render();
</script></body></html>
